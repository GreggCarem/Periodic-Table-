<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Periodic Table</title>
    <script src="./script.js" defer></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Courier New", Courier, monospace;
        background: linear-gradient(145deg, #2b2b2b, #1e1e1e);
        color: #e0e0e0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        height: 100vh;
        overflow-y: scroll;
      }

      h1 {
        margin: 1rem 0;
      }

      #container {
        display: grid;
        grid-template-columns: repeat(18, 4rem);
        grid-gap: 0.5rem;
        background-color: rgba(30, 30, 30, 0.8);
        padding: 1rem;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
        max-width: 98%;
      }

      .element {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #333;
        color: #fff;
        border: 1px solid #555;
        border-radius: 5px;
        width: 4rem;
        height: 4rem;
        text-align: center;
        font-size: 0.75rem;
        transition: background-color 0.3s, transform 0.2s;
      }

      .element:hover {
        background-color: #555;
        transform: scale(1.3);
      }

      .element span {
        display: block;
      }

      .atomic-number {
        font-size: 0.6rem;
        color: #ccc;
      }

      .symbol {
        font-size: 1.2rem;
        font-weight: bold;
      }

      .name {
        font-size: 0.5rem;
        color: #aaa;
      }
      .name:hover {
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <h1>Periodic Table</h1>
    <div id="container"></div>
  </body>
</html>
